<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For You ❤️</title>

<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    background:#000;
    color:#fff;
    font-family: 'Segoe UI', sans-serif;
  }

  .left{
    width:40%;
    padding:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    line-height:1.6;
  }

  .right{
    width:60%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .click-text{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    font-size:18px;
    opacity:.8;
  }

  svg{
    width:300px;
    height:400px;
  }

  .hidden{ opacity:0; }

  .seed{
    fill:#ff9db5;
  }

  .trunk{
    stroke:#ff9db5;
    stroke-width:6;
    fill:none;
    stroke-linecap:round;
  }

  .branch{
    stroke:#ff9db5;
    stroke-width:4;
    fill:none;
    stroke-linecap:round;
  }

  .flower{
    fill:#ff6f91;
    opacity:0;
    transform-origin:center;
  }
</style>
</head>

<body>

<div class="left" id="message">
  Click the heart… 💗<br><br>
  I just want you to know<br>
  how special you are to me 🌸
</div>

<div class="right">
  <div class="click-text" id="clickText">Click me ❤️</div>

  <svg viewBox="0 0 300 400">

    <!-- HEART -->
    <path id="heart"
      d="M150 120
         C 150 90, 100 90, 100 120
         C 100 150, 150 180, 150 200
         C 150 180, 200 150, 200 120
         C 200 90, 150 90, 150 120 Z"
      fill="#ff6f91"
      style="cursor:pointer"
    />

    <!-- SEED -->
    <circle id="seed" cx="150" cy="200" r="6" class="seed hidden"/>

    <!-- TRUNK -->
    <path id="trunk" d="M150 260 L150 160" class="trunk hidden"/>

    <!-- BRANCHES -->
    <path id="b1" d="M150 180 L120 150" class="branch hidden"/>
    <path id="b2" d="M150 180 L180 150" class="branch hidden"/>

    <!-- FLOWERS -->
    <circle class="flower" cx="120" cy="150" r="6"/>
    <circle class="flower" cx="180" cy="150" r="6"/>
    <circle class="flower" cx="150" cy="140" r="7"/>

    <!-- GROUND -->
    <line x1="80" y1="260" x2="220" y2="260" stroke="#555"/>
  </svg>
</div>

<script>
  const heart = document.getElementById("heart");
  const seed = document.getElementById("seed");
  const trunk = document.getElementById("trunk");
  const branches = document.querySelectorAll(".branch");
  const flowers = document.querySelectorAll(".flower");
  const clickText = document.getElementById("clickText");

  heart.addEventListener("click", () => {
    clickText.style.display = "none";

    // Heart → seed
    heart.animate([
      { transform: "scale(1)", opacity:1 },
      { transform: "scale(0.2)", opacity:0 }
    ], { duration:600, fill:"forwards" });

    setTimeout(()=>{
      seed.classList.remove("hidden");
      seed.animate([
        { cy:200 },
        { cy:260 }
      ], { duration:600, fill:"forwards" });
    },500);

    // Grow trunk
    setTimeout(()=>{
      trunk.classList.remove("hidden");
      trunk.style.strokeDasharray = 120;
      trunk.style.strokeDashoffset = 120;
      trunk.animate([
        { strokeDashoffset:120 },
        { strokeDashoffset:0 }
      ], { duration:800, fill:"forwards" });
    },1200);

    // Branches
    setTimeout(()=>{
      branches.forEach(b=>{
        b.classList.remove("hidden");
        b.style.strokeDasharray = 60;
        b.style.strokeDashoffset = 60;
        b.animate([
          { strokeDashoffset:60 },
          { strokeDashoffset:0 }
        ], { duration:600, fill:"forwards" });
      });
    },2000);

    // Flowers bloom
    setTimeout(()=>{
      flowers.forEach((f,i)=>{
        f.animate([
          { transform:"scale(0)", opacity:0 },
          { transform:"scale(1)", opacity:1 }
        ], { duration:500, delay:i*150, fill:"forwards" });
      });
    },2600);
  });
</script>

</body>
</html>
